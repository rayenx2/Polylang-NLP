<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bgPolylangN" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accPolylangN" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="glowPolylangN" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridPolylangN" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="rgPolylangN" cx="85%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#0a0f1e;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bgPolylangN)"/>
  <rect width="1280" height="320" fill="url(#gridPolylangN)" opacity="0.4"/>
  <rect width="1280" height="320" fill="url(#rgPolylangN)"/>
  <rect x="0" y="0" width="1280" height="2" fill="url(#accPolylangN)" opacity="0.7"/>
  <rect x="0" y="0" width="4" height="320" fill="url(#accPolylangN)"/>

  <!-- Logo: two overlapping speech bubbles — multilingual dialogue (sentiment + Q&A) -->
  <g transform="translate(64, 112)" filter="url(#glowPolylangN)">
    <rect width="96" height="96" rx="16" fill="url(#accPolylangN)" opacity="0.9"/>
    <g transform="translate(24, 24) scale(2, 2)" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 8a2 2 0 0 1-2 2H7l-2.5 2.5V4a2 2 0 0 1 2-2h7.5a2 2 0 0 1 2 2z" opacity="0.55" fill="none"/>
      <path d="M21 13a2 2 0 0 1-2 2h-7.5L9 17.5V9a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z" fill="none"/>
    </g>
  </g>

  <text x="184" y="158" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="62" font-weight="700" fill="#f1f5f9" letter-spacing="-2">
    Polylang<tspan fill="url(#accPolylangN)">-NLP</tspan>
  </text>

  <text x="186" y="198" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="17" font-weight="400" fill="#64748b" letter-spacing="0.2">
    Multilingual sentiment analysis  ·  retrieval-augmented Q&amp;A  ·  transformer-powered
  </text>

  <line x1="184" y1="218" x2="820" y2="218" stroke="#1e293b" stroke-width="1"/>

  <g transform="translate(184, 236)">
    <rect width="118" height="34" rx="6" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
    <text x="59" y="13" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="9" fill="#475569" text-anchor="middle" letter-spacing="1" font-weight="600">SENTIMENT</text>
    <text x="59" y="27" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="600">transformer</text>
  </g>
  <g transform="translate(314, 236)">
    <rect width="118" height="34" rx="6" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
    <text x="59" y="13" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="9" fill="#475569" text-anchor="middle" letter-spacing="1" font-weight="600">RAG QA</text>
    <text x="59" y="27" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="600">FAISS-backed</text>
  </g>
  <g transform="translate(444, 236)">
    <rect width="118" height="34" rx="6" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
    <text x="59" y="13" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="9" fill="#475569" text-anchor="middle" letter-spacing="1" font-weight="600">SEMANTIC</text>
    <text x="59" y="27" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="600">search</text>
  </g>
  <g transform="translate(574, 236)">
    <rect width="118" height="34" rx="6" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
    <text x="59" y="13" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="9" fill="#475569" text-anchor="middle" letter-spacing="1" font-weight="600">5 LANGUAGES</text>
    <text x="59" y="27" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="600">en/es/fr/de/zh</text>
  </g>
</svg>
